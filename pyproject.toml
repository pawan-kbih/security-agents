[project]
name = "zelis-security-agents"
version = "0.1.0"
description = "Zelis security agents assessment: AI-assisted architecture review and penetration testing with human approval guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
